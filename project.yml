name: SuanLeMe
options:
  bundleIdPrefix: com.suanleme
  deploymentTarget:
    iOS: "15.0"
targets:
  SuanLeMe:
    type: application
    platform: iOS
    sources:
      - path: SuanLeMe
        excludes:
          - "Games/**"
      # 本地游戏目录：作为 folder reference 打包，保留 Games 子目录结构（App 内置、离线可玩）
      - path: SuanLeMe/Games
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suanleme.yixue.wanleme
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "27"
        INFOPLIST_KEY_CFBundleDisplayName: "算了吗·易游"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"
    info:
      path: SuanLeMe/Info.plist
      properties:
        # 只使用系统 HTTPS / WKWebView，属豁免范围；声明 false 避免每次构建
        # 都停在 MISSING_EXPORT_COMPLIANCE（build 6 实测踩过）。
        ITSAppUsesNonExemptEncryption: false
        # 保存分享海报到相册（原生写入，避免 WebView 处理 data: 大图闪退）
        NSPhotoLibraryAddUsageDescription: "保存游戏分享海报到相册"
        NSPhotoLibraryUsageDescription: "保存游戏分享海报到相册"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
