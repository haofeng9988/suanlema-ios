workflows:
  ios-build:
    name: SuanLeMe iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "SuanLeMe.xcodeproj"
        XCODE_SCHEME: "SuanLeMe"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build ipa
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/SuanLeMe.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=68UURQ95X7 \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            clean archive
      - name: Export ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/SuanLeMe.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export
    artifacts:
      - build/export/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - 148452410@qq.com
