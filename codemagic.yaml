workflows:
  ios-build:
    name: SuanLeMe iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "SuanLeMe.xcodeproj"
        XCODE_SCHEME: "SuanLeMe"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.suanleme.yixue.AppStore
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $ASC_PRIVATE_KEY
        key_id: $ASC_KEY_ID
        issuer_id: $ASC_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - 148452410@qq.com