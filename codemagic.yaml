workflows:
  ios-build:
    name: SuanLeMe iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "SuanLeMe.xcodeproj"
        XCODE_SCHEME: "SuanLeMe"
        BUNDLE_ID: "com.suanleme.yixue.AppStore"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.suanleme.yixue.AppStore
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Find profile
        script: |
          echo "--- profiles in user data dir ---"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "no user data dir"
          echo "--- profiles in mobile device ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "no mobile device dir"
          echo "--- find all profiles ---"
          find ~ -name "*.mobileprovision" 2>/dev/null
      - name: Set up code signing
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa
        script: |
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          echo "Using profile: $PROFILE_PATH"
          xcodebuild build \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/SuanLeMe.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=68UURQ95X7 \
            PROVISIONING_PROFILE_SPECIFIER="com.suanleme.yixue.AppStore" \
            archive
      - name: Export ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/SuanLeMe.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export
    artifacts:
      - build/export/*.ipa
    publishing:
      email:
        recipients:
          - 148452410@qq.com