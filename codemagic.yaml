workflows:
  ios-build:
    name: SuanLeMe iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "SuanLeMe.xcodeproj"
        XCODE_SCHEME: "SuanLeMe"
        BUNDLE_ID: "com.suanleme.yixue"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcodebuild build \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/SuanLeMe.xcarchive \
            archive
      - name: Export ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/SuanLeMe.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export
    artifacts:
      - build/export/*.ipa
    publishing:
      email:
        recipients:
          - 148452410@qq.com