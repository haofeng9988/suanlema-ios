workflows:
  ios-build:
    name: SuanLeMe iOS Build
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        XCODE_PROJECT: "SuanLeMe.xcodeproj"
        XCODE_SCHEME: "SuanLeMe"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.suanleme.yixue.wanleme
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix source layout
        script: |
          cd SuanLeMe/Assets.xcassets
          [ -f AppDelegate.swift ] && mv AppDelegate.swift ../AppDelegate.swift || true
          [ -f ViewController.swift ] && mv ViewController.swift ../ViewController.swift || true
          [ -f IAPManager.swift ] && mv IAPManager.swift ../IAPManager.swift || true
          [ -f splash_logo.png ] && mv splash_logo.png ../splash_logo.png || true
          cd ../..
          echo "=== SuanLeMe/ ==="
          ls -la SuanLeMe/
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa (Codemagic official)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    # ⚠️ 2026-10-23: 旧 Codemagic 工作流已停用（试用已到期）。
    # 私钥此前被明文写在 public repo 中（已泄露）→ 必须吊销 key 2UJ4MCYPB6 并换新密钥。
    # 新的构建方式：GitHub Actions -> .github/workflows/ios-build.yml（macos-latest），密钥走 Repo Secrets。
